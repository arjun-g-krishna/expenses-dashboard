services:
  db:
    image: mirror.gcr.io/library/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-expenses}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-expenses}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5432:5432

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-expenses}
      DB_SSLMODE: disable
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:${API_PORT:-8080}}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped

volumes:
  db-data:
