services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-expenses}
    volumes:
      - db-data-dev:/var/lib/postgresql/data
      - ./tests/00_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./tests/seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-expenses}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-expenses}
      DB_SSLMODE: disable
      ALLOWED_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /workspace/web
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm install; fi && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8080}
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/web/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  db-data-dev:
  go-mod-cache:
  go-build-cache:
  web-node-modules: